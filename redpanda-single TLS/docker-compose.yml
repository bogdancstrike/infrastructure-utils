version: "3.7"
name: redpanda-quickstart-one-broker
networks:
  redpanda_network:
    driver: bridge
volumes:
  redpanda-x: null
  connect-certs: 
services:
  redpanda-x:
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Address the broker advertises to clients that connect to the Kafka API.
      # Use the internal addresses to connect to the Redpanda brokers'
      # from inside the same Docker network.
      # Use the external addresses to connect to the Redpanda brokers'
      # from outside the Docker network.
      - --advertise-kafka-addr internal://redpanda-x:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      # Address the broker advertises to clients that connect to the HTTP Proxy.
      - --advertise-pandaproxy-addr internal://redpanda-x:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      # Redpanda brokers use the RPC API to communicate with each other internally.
      - --rpc-addr redpanda-x:33145
      - --advertise-rpc-addr redpanda-x:33145
      # Mode dev-container uses well-known configuration properties for development in containers.
      - --mode dev-container
      # Tells Seastar (the framework Redpanda uses under the hood) to use 1 core on the system.
      - --smp 1
      - --default-log-level=info
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.3
    container_name: redpanda-x
    volumes:
      - redpanda-x:/var/lib/redpanda/data
      - connect-certs:/opt/kafka/connect-certs/user-secret
    networks:
      - redpanda_network
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    environment:
      CONNECT_TLS_ENABLED: "true"
      CONNECT_TRUSTED_CERTS: "user-secret/ca-crt.crt"
      CONNECT_TLS_AUTH_CERT: "user-secret/server.crt"
      CONNECT_TLS_AUTH_KEY: "user-secret/server.key"

  console:
    container_name: redpanda-console-x
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    networks:
      - redpanda_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-x:9092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda-x:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-x:9644"]
    ports:
      - 8080:8080
    depends_on:
      - redpanda-x
