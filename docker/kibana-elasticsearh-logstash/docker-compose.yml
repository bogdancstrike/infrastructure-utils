###########################################################################
#  Storing EventStoreDB logs into ElasticSearch with Filebeat and Logstash
###########################################################################
#  DISCLAIMER: This configuration is presented as docker-compose
#  to simplify the developer environment setup. 
#  It aims to give the quick option to play with Elastic setup.
#  It's NOT recommended to run setup through docker-compose on production.
###########################################################################

# map logs to disk location and share between containers
x-eventstore-volume-logs: &eventstore-volume-logs
  type: bind
  source: ./logs
  target: /var/log/eventstore

services:
    #######################################################
    #  EventStoreDB
    #######################################################
  eventstoredb:
    image: kurrentplatform/kurrentdb:26.2.2
    container_name: eventstoredb
        # use this image if you're running ARM-based proc like Apple M1
        # image: ghcr.io/eventstore/eventstore:21.10.0-alpha-arm64v8
    environment:
      - KURRENTDB_CLUSTER_SIZE=1
      - KURRENTDB_RUN_PROJECTIONS=All
      - KURRENTDB_START_STANDARD_PROJECTIONS=true
      - KURRENTDB_HTTP_PORT=2113
      - KURRENTDB_INSECURE=true
    ports:
      - '2113:2113'
    restart: unless-stopped
    volumes:
      - type: volume
        source: eventstore-volume-data
        target: /var/lib/kurrentdb
            # external volume to be able to share EventStoreDB logs
            # with Filebeat image
      - <<: *eventstore-volume-logs
        target: /var/log/kurrentdb
    networks:
      - esdb_network

    #######################################################
    #  Filebeat to harvest logs from event store logs
    #######################################################
  filebeat:
        # required to have a proper access to config file on Windows
    entrypoint: "filebeat -e -strict.perms=false"
    container_name: file_beat
    image: docker.elastic.co/beats/filebeat:9.5.5
    networks:
      - es_network
        # make sure that Filebeat is restarted
        # in case ElasticSearch or EventStoreDB
        # were not available yet
    restart: unless-stopped
    volumes:
            # add Filebeat config file
      - "./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro"
            # get access to EventStoreDB logs through shared external volume
      - <<: *eventstore-volume-logs
        target: /var/log/kurrentdb
    depends_on:
      - eventstoredb
      - logstash


    #######################################################
    #  Logstash for more advanced log pipelines
    #  e.g. filtering, transformations, etc.
    #  this will split stats and regular logs
    #######################################################
  logstash:
        # required to have a proper access to config file on windows
    container_name: logstash
    image: docker.elastic.co/logstash/logstash:9.5.5
    networks:
      - es_network
    restart: unless-stopped
    volumes:
            # add Logstash config file
      - "./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"
        # make sure that LogStash is restarted
        # in case ElasticSearch was not available yet
    depends_on:
      - elasticsearch


    #######################################################
    #  Elastic Search to store logs
    #######################################################
  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - es_network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120

    #######################################################
    #  Kibana to browse logs
    #  Filebeat will automatically create Data View for logs
    #######################################################
  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:9.5.5
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    restart: unless-stopped
    ports:
      - "5601:5601"
    networks:
      - es_network
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5601 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120

    #######################################################
    #  Call curl once Kibana was started 
    #  to create Kibana Data Views for ESDB logs
    #######################################################
  initializer:
    image: curlimages/curl:8.23.0
    restart: on-failure
    depends_on:
      kibana:
        condition: service_healthy
    networks:
      - es_network
    command:
      - |
        for kind in logs stats; do
          printf '{"data_view":{"title":"eventstoredb-%s*"}}' "$${kind}" |
            curl --fail --retry 12 --retry-delay 5 --retry-all-errors \
              -X POST http://kibana:5601/api/data_views/data_view \
              -H 'kbn-xsrf: true' -H 'Content-Type: application/json' -d @-
        done
    entrypoint:
      - sh
      - -ec

networks:
  es_network:
    driver: bridge
  esdb_network:
    driver: bridge

volumes:
  eventstore-volume-data:
  elastic-data:
