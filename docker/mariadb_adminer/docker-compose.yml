version: '3.8'
services:
  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: dev
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    ports:
      - "3306:3306"
    networks:
      - mariadb-network

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - mariadb-network

volumes:
  mariadb_data:

networks:
  mariadb-network:
    driver: bridge