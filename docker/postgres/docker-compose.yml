services:
  db:
    image: postgres:18.6
    container_name: postgresql-container
    restart: unless-stopped
    volumes:
      - postgres_pgdata:/var/lib/postgresql/data
      - ./entrypoint.sh:/docker-entrypoint-initdb.d/entrypoint.sh
      # - ./postgres-certs/:/var/lib/postgresql/certs/
    networks:
      hera_network:
        ipv4_address: 192.168.0.10
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: hera_data
      PGDATA: /var/lib/postgresql/data/pgdata
      DATABASE_HOST: hera_data
      POSTGRES_MULTIPLE_DATABASES: hera_stack,hera_template,hera_task,hera_data
      SCHEMA: hera
      ANON: web_anon
      AUTHENTICATOR: authenticator
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: pgadmin4-container
    restart: unless-stopped
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # - pgadmin-data:/pgadmin4/servers.json
    networks:
      hera_network:
        ipv4_address: 192.168.0.11
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: me@io.ro
      PGADMIN_DEFAULT_PASSWORD: "[][][]"
      # PGADMIN_CONFIG_SERVER_MODE: False
      # PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: False
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: jaeger-container
    restart: unless-stopped
    networks:
      hera_network:
        ipv4_address: 192.168.0.12
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "14250:14250"
      - "14268:14268"
      - 9411:9411
    command:
      - --config=/etc/jaeger/config.yaml
    volumes:
      - ./../jaeger-opentelemetry/jaeger.yaml:/etc/jaeger/config.yaml:ro
volumes:
  postgres_pgdata:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /opt/docker/pgdata
      o: bind
  pgadmin-data:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /opt/docker/pgadmin
      o: bind

networks:
  hera_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/24
          gateway: 192.168.0.1

