version: '3.8'

services:
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    ports:
      - "9000:9000"  # MinIO S3 API
      - "9001:9001"  # MinIO Console UI
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - minio-network

volumes:
  minio_data:
    driver: local

networks:
  minio-network:
    driver: bridge