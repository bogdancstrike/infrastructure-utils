services:
  minio:
    image: infrastructure-utils/minio:RELEASE.2025-10-15T17-29-55Z
    build: .
    pull_policy: build
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    ports:
      - "9000:9000"  # MinIO S3 API
      - "9001:9001"  # MinIO Console UI
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - minio-network

    restart: unless-stopped
volumes:
  minio_data:
    driver: local

networks:
  minio-network:
    driver: bridge
