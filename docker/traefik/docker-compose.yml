version: '3.8'
services:
  traefik:
    image: traefik:v3.1.2
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    networks:
      - dev-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
networks:
  dev-network:
    driver: bridge