services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.6
    restart: unless-stopped
    ports: ["127.0.0.1:${UPTIME_KUMA_PORT:-3001}:3001"]
    volumes: ["uptime-kuma-data:/app/data"]
    healthcheck:
      test: [CMD, node, extra/healthcheck.js]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
  uptime-kuma-data:
