services:
  influxdb:
    image: influxdb:2.9.1
    restart: unless-stopped
    ports: ["127.0.0.1:8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-development-password}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-development}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-metrics}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-development-token-change-me}
    volumes: ["influxdb-data:/var/lib/influxdb2", "influxdb-config:/etc/influxdb2"]
    healthcheck:
      test: [CMD, influx, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-adminpassword}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-development}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-metrics}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-development-token-change-me}
    depends_on:
      influxdb:
        condition: service_healthy
    volumes: ["grafana-data:/var/lib/grafana", "./provisioning:/etc/grafana/provisioning:ro"]
volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
