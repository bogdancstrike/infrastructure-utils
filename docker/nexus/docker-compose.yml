services:
  nexus:
    image: sonatype/nexus3:3.97.0  # Ensure the latest version is pulled
    ports:
      - "8081:8081"  # Nexus default port
    networks:
      - dev-network
    volumes:
      - nexus-data:/nexus-data  # Persistent data storage
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - NEXUS_CONTEXT_PATH=/nexus
      - INSTALL4J_ADD_VM_PARAMS=-Xms1200M -Xmx1200M -XX:MaxDirectMemorySize=2G
volumes:
  nexus-data:  # Persistent storage for Nexus data
    driver: local

networks:
  dev-network:
    driver: bridge
