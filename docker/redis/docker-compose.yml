services:
  redis:
    image: redis:8.10.2
    ports:
      - "6379:6379"
    networks:
      - dev-network
    volumes:
      - redis_data:/data

    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  redis-ui:
    image: redis/redisinsight:3.8.0
    container_name: redis-ui
    ports:
      - "8085:5540"
    networks:
      - dev-network
    volumes:
      - redisinsight_data:/data
    restart: unless-stopped
volumes:
  redis_data:
  redisinsight_data:

networks:
  dev-network:
    driver: bridge
