events {}

http {
    server {
        listen 443 ssl;

        ssl_certificate /etc/nginx/server.crt;
        ssl_certificate_key /etc/nginx/server.key;
        ssl_client_certificate /etc/nginx/trusted.pem;
        ssl_verify_client on;
        # ssl_verify_depth 2;

        location / {
            default_type text/plain;
            return 200 "Client Certificate Info:\nSubject: $ssl_client_s_dn\nIssuer: $ssl_client_i_dn\n";
        }
    }
}