# openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout certs/ca.key -out certs/ca.crt
# openssl req -new -newkey rsa:2048 -nodes -keyout certs/nginx.key -out certs/nginx.csr
# openssl x509 -req -days 365 -in certs/nginx.csr -CA certs/ca.crt -CAkey certs/ca.key -set_serial 01 -out certs/nginx.crt
services:
  nginx:
    image: nginx:1.30.6-alpine
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./server.crt:/etc/nginx/server.crt
      - ./server.key:/etc/nginx/server.key
      - ./trusted.pem:/etc/nginx/trusted.pem

