version: '3.8'

services:
  mysql:
    image: mysql:8.2.0
    container_name: mysql-dev
    environment:
      MYSQL_DATABASE: dev           # Predefined database
      MYSQL_USER: dev               # Predefined user
      MYSQL_PASSWORD: dev           # Predefined password
      MYSQL_ROOT_PASSWORD: dev      # Root password
    ports:
      - "0.0.0.0:3306:3306"                 # Bind port 3306 to host
    volumes:
      - mysql-data:/var/lib/mysql    # Persist MySQL data
    networks:
      - dev-network
    command: --bind-address=0.0.0.0  # Allow MySQL to listen on all interfaces
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Make host accessible within the container

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8081:80"
    environment:
      - PMA_ARBITRARY=1
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  mysql-data:
