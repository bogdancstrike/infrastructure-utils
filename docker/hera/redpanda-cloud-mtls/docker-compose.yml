networks:
  redpanda-network:
    driver: bridge
    ipam:
      config:
      - subnet: 192.168.5.0/24
volumes:
  redpanda-1:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/redpanda-1
      o: bind
  redpanda-2:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/redpanda-2
      o: bind
  redpanda-3:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/redpanda-3
      o: bind
services:
  redpanda-1:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: redpanda-1
    restart: always
    volumes:
    - redpanda-1:/var/lib/redpanda/data
    - ./redpanda-1.yaml:/etc/redpanda/redpanda.yaml:ro
    - ./tls:/etc/redpanda/tls:ro
    command:
    - redpanda
    - start
    - --config
    - /etc/redpanda/redpanda.yaml
    - --mode
    - dev-container
    - --smp
    - '1'
    ports:
    - 19092:19092
    - 19644:9644
    networks:
      redpanda-network:
        ipv4_address: 192.168.5.2
  redpanda-2:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: redpanda-2
    restart: always
    depends_on:
    - redpanda-1
    volumes:
    - redpanda-2:/var/lib/redpanda/data
    - ./redpanda-2.yaml:/etc/redpanda/redpanda.yaml:ro
    - ./tls:/etc/redpanda/tls:ro
    command:
    - redpanda
    - start
    - --config
    - /etc/redpanda/redpanda.yaml
    - --mode
    - dev-container
    - --smp
    - '1'
    ports:
    - 19093:19093
    - 29644:9644
    networks:
      redpanda-network:
        ipv4_address: 192.168.5.3
  redpanda-3:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: redpanda-3
    restart: always
    depends_on:
    - redpanda-1
    volumes:
    - redpanda-3:/var/lib/redpanda/data
    - ./redpanda-3.yaml:/etc/redpanda/redpanda.yaml:ro
    - ./tls:/etc/redpanda/tls:ro
    command:
    - redpanda
    - start
    - --config
    - /etc/redpanda/redpanda.yaml
    - --mode
    - dev-container
    - --smp
    - '1'
    ports:
    - 19094:19094
    - 39644:9644
    networks:
      redpanda-network:
        ipv4_address: 192.168.5.4
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    container_name: redpanda-console
    restart: always
    depends_on:
    - redpanda-1
    environment:
    - KAFKA_BROKERS=redpanda-1:9092,redpanda-2:9092,redpanda-3:9092
    - KAFKA_TLS_ENABLED=true
    - KAFKA_TLS_CAFILEPATH=/etc/tls/ca.crt
    - KAFKA_TLS_CERTFILEPATH=/etc/tls/client.crt
    - KAFKA_TLS_KEYFILEPATH=/etc/tls/client.key
    volumes:
    - ./tls:/etc/tls:ro
    ports:
    - 8080:8080
    networks:
      redpanda-network:
        ipv4_address: 192.168.5.5
