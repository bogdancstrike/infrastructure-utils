name: redpanda-quickstart-one-broker
networks:
  redpanda_network:
    driver: bridge
volumes:
  redpanda-x: null
services:
  redpanda-x:
    command:
    - redpanda
    - start
    - --config
    - /etc/redpanda/redpanda.yaml
    - --mode
    - dev-container
    - --smp
    - '1'
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: redpanda-x
    volumes:
    - redpanda-x:/var/lib/redpanda/data
    - ./connect-certs:/etc/redpanda/tls:ro
    - ./redpanda.yaml:/etc/redpanda/redpanda.yaml:ro
    networks:
    - redpanda_network
    ports:
    - 19092:19092
    - 19644:9644
    restart: unless-stopped
  console:
    container_name: redpanda-console-x
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    networks:
    - redpanda_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: "kafka:\n  brokers:\n  - redpanda-x:9092\n  tls:\n    enabled: true\n    caFilepath: /etc/redpanda/tls/ca-crt.crt\n\
        \    certFilepath: /etc/redpanda/tls/server.crt\n    keyFilepath: /etc/redpanda/tls/server.key\nredpanda:\n  adminApi:\n\
        \    enabled: true\n    urls:\n    - http://redpanda-x:9644\n"
    ports:
    - 8080:8080
    depends_on:
    - redpanda-x
    restart: unless-stopped
    volumes:
    - ./connect-certs:/etc/redpanda/tls:ro
