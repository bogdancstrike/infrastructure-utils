version: '3.8'
services:
  redis:
    image: redis:7.0.4
    ports:
      - "6379:6379"
    networks:
      - dev-network
    volumes:
      - redis_data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: "local:redis:6379"
    ports:
      - "8081:8081"
    networks:
      - dev-network

volumes:
  redis_data:
networks:
  dev-network:
    driver: bridge