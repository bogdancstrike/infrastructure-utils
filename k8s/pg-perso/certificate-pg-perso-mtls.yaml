#
#vault policy write pg_hera_mtls - <<EOF
#path "pki_int_mtls*"                        { capabilities = ["read", "list"] }
#path "pki_int_mtls/sign/pg_hera_mtls"    { capabilities = ["create", "update"] }
#path "pki_int_mtls/issue/pg_hera_mtls"   { capabilities = ["create"] }
#EOF
#
#vault write auth/kubernetes/role/pg_hera_mtls_issuer \
#    bound_service_account_names=vault-auth \
#    bound_service_account_namespaces=pg-hera \
#    policies=pg_hera_mtls \
#    ttl=24h
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: postgresdb
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: pg-hera-mtls-issuer
  namespace: postgresdb
spec:
  vault:
    server: https://vault.vault:8200
    path: pki_int_mtls/sign/pg_hera_mtls
    caBundle: 
    auth:
      kubernetes:
        role: pg_hera_mtls_issuer
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: vault-auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pg-perso-mtls-certs
  namespace: postgresdb
spec:
  secretName: pg-perso-mtls
  issuerRef:
    name: pg-hera-mtls-issuer
    kind: Issuer
  commonName: _crunchyrepl
  dnsNames:
    - _crunchyrepl
    - pg-perso
    - pg-perso.postgresdb
    - pg-perso.postgresdb.svc
    - pg-perso.postgresdb.svc.cluster.local
    - pg-perso-ha
    - pg-perso-ha.postgresdb
    - pg-perso-ha.postgresdb.svc.cluster.local
    - pg-perso-primary
    - pg-perso-primary.postgresdb
    - pg-perso-primary.postgresdb.svc.cluster.local
    - pg-perso-pgbouncer
    - pg-perso-pgbouncer.postgresdb
    - pg-perso-pgbouncer.postgresdb.svc.cluster.local
    - pg-perso-replica
    - pg-perso-replica.postgresdb
    - pg-perso-replica.postgresdb.svc
    - pg-perso-replica.postgresdb.svc.cluster.local
    - pg-perso-replica-ha
    - pg-perso-replica-ha.postgresdb
    - pg-perso-replica-ha.postgresdb.svc.cluster.local
  isCA: false
  duration: 2169h0m0s
  renewBefore: 2000h0m0s
  subject:
    countries:
      - RO
    organizations:
      - Hera-mTLS
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
    - key agreement
