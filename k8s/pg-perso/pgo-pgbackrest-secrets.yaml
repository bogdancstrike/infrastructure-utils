apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pgo-pgbackrest-secrets
  namespace: postgresdb
spec:
  mount: external-secrets
  type: kv-v2
  path: pgo-pgbackrest-secrets
  refreshAfter: 10s
  destination:
    create: true
    overwrite: true
    name: pgo-pgbackrest-secrets
