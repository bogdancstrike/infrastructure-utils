#vault write pki_int_mtls/roles/ejbca_mtls allowed_domains="cluster.local,ejbca,ejbca.ejbca,ejbca.ejbca.svc,ejbca.ejbca.svc.cluster.local" allow_subdomains=true allow_bare_domains=true enforce_hostnames=false
#
#vault policy write ejbca_mtls - <<EOF
#path "pki_int_mtls*"                        { capabilities = ["read", "list"] }
#path "pki_int_mtls/sign/ejbca_mtls"    { capabilities = ["create", "update"] }
#path "pki_int_mtls/issue/ejbca_mtls"   { capabilities = ["create"] }
#EOF
#
#vault write auth/kubernetes/role/ejbca_mtls_issuer \
#    bound_service_account_names=vault-auth \
#    bound_service_account_namespaces=ejbca \
#    policies=ejbca_mtls \
#    ttl=24h

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: ejbca
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-mtls-issuer
  namespace: ejbca
spec:
  vault:
    server: https://vault.vault:8200
    path: pki_int_mtls/sign/ejbca_mtls
    caBundle: 
    auth:
      kubernetes:
        role: ejbca_mtls_issuer
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: vault-auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ejbca-mtls-certs
  namespace: ejbca
spec:
  commonName: ejbca
  dnsNames:
  - ejbca
  - ejbca.ejbca
  - ejbca.ejbca.svc
  - ejbca.ejbca.svc.cluster.local
  duration: 2160h0m0s
  ipAddresses:
  - 127.0.0.1
  isCA: false
  issuerRef:
    kind: Issuer
    name: vault-mtls-issuer
  renewBefore: 2100h0m0s
  secretName: ejbca-mtls
  privateKey:
    algorithm: RSA 
    encoding: PKCS8
    size: 2048
  additionalOutputFormats:
  - type: DER
  subject:
    countries:
    - RO
    organizations:
    - Hera-mTLS
  usages:
  - digital signature
  - key encipherment
  - server auth
  - client auth
  - key agreement

