apiVersion: v1
kind: Namespace
metadata:
  name: infrastructure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: &id001
    app.kubernetes.io/name: mailpit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mailpit
        image: axllent/mailpit:v1.31.6
        ports:
        - name: smtp
          containerPort: 1025
        - name: http
          containerPort: 8025
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        env:
        - name: MP_DATABASE
          value: /data/mailpit.db
        - name: MP_MAX_MESSAGES
          value: '5000'
        - name: MP_SMTP_AUTH_ACCEPT_ANY
          value: 'true'
        - name: MP_SMTP_AUTH_ALLOW_INSECURE
          value: 'true'
        readinessProbe:
          httpGet: &id002
            path: /readyz
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id002
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          httpGet: *id002
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: data
          mountPath: /data
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mailpit-data
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels: &id001
    app.kubernetes.io/name: mailpit
spec:
  type: ClusterIP
  selector: *id001
  ports:
  - name: smtp
    port: 1025
    targetPort: smtp
  - name: http
    port: 8025
    targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailpit-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
