apiVersion: v1
kind: Namespace
metadata:
  name: infrastructure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: &id001
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: postgres:18.6
        ports:
        - name: postgres
          containerPort: 5432
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        env:
        - name: POSTGRES_DB
          value: development
        - name: POSTGRES_USER
          value: development
        - name: PGDATA
          value: /var/lib/postgresql/18/docker
        envFrom:
        - secretRef:
            name: postgres-credentials
        readinessProbe:
          exec: &id002
            command:
            - sh
            - -ec
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec: *id002
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          exec: *id002
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: &id001
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector: *id001
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
