apiVersion: v1
kind: Namespace
metadata:
  name: infrastructure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels: &id001
    app.kubernetes.io/name: valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: valkey
        image: valkey/valkey:9.1.2-alpine
        ports:
        - name: redis
          containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        envFrom:
        - secretRef:
            name: valkey-credentials
        args:
        - exec valkey-server --appendonly yes --requirepass "$VALKEY_PASSWORD"
        command:
        - sh
        - -ec
        readinessProbe:
          exec: &id002
            command:
            - sh
            - -ec
            - VALKEYCLI_AUTH="$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec: *id002
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          exec: *id002
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: data
          mountPath: /data
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: valkey-data
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels: &id001
    app.kubernetes.io/name: valkey
spec:
  type: ClusterIP
  selector: *id001
  ports:
  - name: redis
    port: 6379
    targetPort: redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
