apiVersion: v1
kind: Namespace
metadata:
  name: infrastructure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  labels: &id001
    app.kubernetes.io/name: uptime-kuma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: uptime-kuma
        image: louislam/uptime-kuma:2.5.6
        ports:
        - name: http
          containerPort: 3001
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        readinessProbe:
          httpGet: &id002
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id002
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          httpGet: *id002
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: data
          mountPath: /app/data
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: uptime-kuma-data
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  labels: &id001
    app.kubernetes.io/name: uptime-kuma
spec:
  type: ClusterIP
  selector: *id001
  ports:
  - name: http
    port: 3001
    targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
