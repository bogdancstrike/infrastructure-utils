apiVersion: v1
kind: Namespace
metadata:
  name: infrastructure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: &id001
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.8.1
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        env:
        - name: KC_HEALTH_ENABLED
          value: 'true'
        envFrom:
        - secretRef:
            name: keycloak-credentials
        args:
        - start-dev
        readinessProbe:
          httpGet: &id002
            path: /health/live
            port: management
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id002
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          httpGet: *id002
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: data
          mountPath: /opt/keycloak/data
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: keycloak-data
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: &id001
    app.kubernetes.io/name: keycloak
spec:
  type: ClusterIP
  selector: *id001
  ports:
  - name: http
    port: 8080
    targetPort: http
  - name: management
    port: 9000
    targetPort: management
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
