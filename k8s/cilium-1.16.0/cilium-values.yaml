image:
  repository: "nexus.hera.ro/quay.io/cilium/cilium"
  tag: "v1.16.0"
  pullPolicy: "IfNotPresent"
  useDigest: false
certgen:
  image:
    repository: "nexus.hera.ro/quay.io/cilium/certgen"
    tag: "v0.2.0"
    useDigest: false
    pullPolicy: "IfNotPresent"
envoy:
  image:
    repository: "nexus.hera.ro/quay.io/cilium/cilium-envoy"
    tag: "v1.29.7-39a2a56bbd5b3a591f69dbca51d3e30ef97e0e51"
    pullPolicy: "IfNotPresent"
    useDigest: false
operator:
  image:
    repository: "nexus.hera.ro/quay.io/cilium/operator"
    tag: "v1.16.0"
    useDigest: false
    pullPolicy: "IfNotPresent"
preflight:
  # -- Enable Cilium pre-flight resources (required for upgrade)
  enabled: false
  image:
    repository: "nexus.hera.ro/quay.io/cilium/cilium"
    tag: "v1.16.0"
    useDigest: false
    pullPolicy: "IfNotPresent"

hubble:
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - http
  relay:
    enabled: true
    image:
      repository: "nexus.hera.ro/quay.io/cilium/hubble-relay"
      tag: "v1.16.0"
      useDigest: false
      pullPolicy: "IfNotPresent"
  ui:
    enabled: true
    backend:
      image:
        repository: "nexus.hera.ro/quay.io/cilium/hubble-ui-backend"
        tag: "v0.13.1"
        useDigest: false
        pullPolicy: "IfNotPresent"
    frontend:
      image:
        repository: "nexus.hera.ro/quay.io/cilium/hubble-ui"
        tag: "v0.13.1"
        useDigest: false
        pullPolicy: "IfNotPresent"


clustermesh:
  useAPIServer: true
  apiserver:
    image:
      repository: "nexus.hera.ro/quay.io/cilium/clustermesh-apiserver"
      tag: "v1.16.0"
      useDigest: false
      pullPolicy: "IfNotPresent"
    service:
      type: LoadBalancer
      loadBalancerIP: "10.10.20.190"
    metrics:
      enabled: false
    kvstoremesh:
      enabled: false


# Cluster Mesh
cluster:
  name: kubernetes
  id: 1

ipam:
  mode: "cluster-pool"
  operator: 
    clusterPoolIPv4PodCIDRList: ["192.168.0.0/16"]

kubeProxyReplacement: "true"
k8sServiceHost: k8s.hera.ro
k8sServicePort: 6443


l2announcements:
  enabled: true
devices: ens18
externalIPs:
  enabled: true
