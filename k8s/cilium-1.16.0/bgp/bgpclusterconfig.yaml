apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp
spec:
  nodeSelector:
    matchLabels:
      bgp: active
  bgpInstances:
  - name: "65501"
    localASN: 65501
    peers:
    - name: "forti-65501"
      peerASN: 65501
      peerAddress: 10.10.21.1
      peerConfigRef:
        name: "cilium-peer"
