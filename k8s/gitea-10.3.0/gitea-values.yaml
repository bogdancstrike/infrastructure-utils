global:
  imageRegistry: "nexus.hera.ro"

replicaCount: 3

strategy:
  type: "RollingUpdate"
  rollingUpdate:
    maxUnavailable: 1

image:
  repository: gitea/gitea
  tag: "1.22.0"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: vault-tls-clusterissuer
    cert-manager.io/common-name: git.hera.ro
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: git.hera.ro
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: git.hera.ro-tls
      hosts:
        - git.hera.ro

persistence:
  enabled: true
  create: true
  mount: true
  storageClass: "csi-cephfs-sc"
  claimName: gitea-storage
  size: 16Gi
  accessModes:
    - ReadWriteMany

gitea:
  admin:
    existingSecret: gitea-admin
  config:
    APP_NAME: "HERA Git"
    RUN_MODE: prod
    database:
      DB_TYPE: postgres
      HOST: pg-perso-ha.postgresdb:5432
      NAME: gitea
      SSL_MODE: require
    indexer:
      ISSUE_INDEXER_TYPE: db
      REPO_INDEXER_ENABLED: false
    server:
      DOMAIN: git.hera.ro
      SSH_DOMAIN: git.hera.ro
      HTTP_PORT: 3000
      PROTOCOL: http
      DISABLE_SSH: false
      SSH_LISTEN_PORT: 2222 # rootless image
    security:
      INSTALL_LOCK: true
    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: true
      REGISTER_EMAIL_CONFIRM: false
      ENABLE_NOTIFY_MAIL: false
      ALLOW_ONLY_EXTERNAL_REGISTRATION: false
      ENABLE_CAPTCHA: false
      DEFAULT_KEEP_EMAIL_PRIVATE: false
      DEFAULT_ALLOW_CREATE_ORGANIZATION: true
      DEFAULT_ENABLE_TIMETRACKING: true
      NO_REPLY_ADDRESS: noreply.localhost
      DEFAULT_USER_VISIBILITY: private
      DEFAULT_ORG_VISIBILITY: private
    cron.update_checker:
      ENABLED: false
    repository.signing:
      DEFAULT_TRUST_MODEL: committer
    actions:
      enabled: true
#      DEFAULT_ACTIONS_URL: http://gitea-http.gitea.svc.cluster.local:3000

  additionalConfigFromEnvs:
    - name: GITEA__DATABASE__USER
      valueFrom:
        secretKeyRef:
          name: gitea-postgresql
          key: dbuser
    - name: GITEA__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-postgresql
          key: dbpassword
    - name: GITEA__SERVER__LFS_JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: gitea-other
          key: lfs-jwt-secret
    - name: GITEA__SECURITY__SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: gitea-other
          key: secret-key
    - name: GITEA__SECURITY__INTERNAL_TOKEN
      valueFrom:
        secretKeyRef:
          name: gitea-other
          key: internal_token
    - name: GITEA__SECURITY__PASSWORD_HASH_ALGO
      valueFrom:
        secretKeyRef:
          name: gitea-other
          key: hash_algo
    - name: GITEA__OAUTH2__JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: gitea-other
          key: jwt_secret

extraVolumes:
 - name: ca
   secret:
     secretName: hera-ca

extraVolumeMounts:
 - name: ca
   mountPath: "/etc/ssl/certs/hera-ca.pem"
   subPath: "hera-ca.pem"
   readOnly: true

redis-cluster:
  enabled: true
  existingSecret: "gitea-rediss"
  existingSecretPasswordKey: "redis-password"
  cluster:
    nodes: 3
    replicas: 0
  persistence:
    enabled: true
    storageClass: "csi-rbd-sc"
    accessModes:
      - ReadWriteOnce
    size: 4Gi

redis:
  enabled: false
postgresql-ha:
  enabled: false
postgresql:
  enabled: false
