alertmanager:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: vault-tls-clusterissuer
      cert-manager.io/common-name: alertmanager.hera.ro
    hosts:
      - alertmanager.hera.ro
    path: /
    tls:
    - secretName: alertmanager.hera.ro-tls
      hosts:
      - alertmanager.hera.ro

grafana:
  adminPassword: "[][][]"
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: vault-tls-clusterissuer
      cert-manager.io/common-name: grafana.hera.ro
    hosts:
      - grafana.hera.ro
    path: /
    tls:
    - secretName: grafana.hera.ro-tls
      hosts:
      - grafana.hera.ro
  persistence:
    type: pvc
    enabled: true
    storageClassName: csi-cephfs-sc
    accessModes:
      - ReadWriteOnce
    size: 10Gi

##################
  sidecar:
    datasources:
      enabled: true
      timeout: 30
      defaultDatasourceScrapeInterval: 5s  
  serviceMonitor:
    interval: 5s
    scrapeTimeout: 30s
##################

prometheus:
###
  monitor:
    scheme: https
# ###
#   prometheusSpec:
#     secrets: ['etcd-client-cert']
###
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: vault-tls-clusterissuer
      cert-manager.io/common-name: prometheus.hera.ro
    hosts:
      - prometheus.hera.ro
    path: /
    tls:
    - secretName: prometheus.hera.ro-tls
      hosts:
      - prometheus.hera.ro
##########
  serviceMonitor:
    interval: 5s
  additionalServiceMonitors:
    - name: "luna-client-proxy"
      selector:
        matchLabels:
          app.kubernetes.io/name: luna-client-proxy
      endpoints:
        - port: http
      namespaceSelector:
        matchNames:
          - luna-client-proxy
    - name: "vault"
      selector:
        matchLabels:
          app.kubernetes.io/name: vault
      endpoints:
        - port: https
          interval: 30s
          path: /v1/sys/metrics
          scheme: https
          tlsConfig:
            insecureSkipVerify: true
          authorization:
            credentials:
              name: vault-prometheus-metrics
              key: token
      namespaceSelector:
        matchNames:
          - vault
  ##
  prometheusSpec:
    persistentVolumeClaimRetentionPolicy:
     whenDeleted: Retain
     whenScaled: Retain
    storageSpec:
     volumeClaimTemplate:
       spec:
         storageClassName: csi-cephfs-sc
         accessModes: ["ReadWriteOnce"]
         resources:
           requests:
             storage: 10Gi
    additionalScrapeConfigs:
      - job_name: 'ceph'
        honor_labels: true
        scheme: https
        tls_config:
          ca_file: /etc/prometheus/certs-extra/ca.crt
          cert_file: /etc/prometheus/certs-extra/tls.crt
          key_file: /etc/prometheus/certs-extra/tls.key
          insecure_skip_verify: true
        static_configs:
          - targets:
              - '10.10.20.111:9283'
            # - '10.10.20.112:9283'
            # - '10.10.20.113:9283'
      - job_name: 'proxmox'
        honor_labels: true
        scheme: https
        tls_config:
          ca_file: /etc/prometheus/certs-extra/ca.crt
          cert_file: /etc/prometheus/certs-extra/tls.crt
          key_file: /etc/prometheus/certs-extra/tls.key
          insecure_skip_verify: true
        static_configs:
          - targets:
              - '10.10.50.11:9100'
              - '10.10.50.12:9100'
              - '10.10.50.13:9100'
      # - job_name: 'vault'
      #   metrics_path: /v1/sys/metrics
      #   scheme: https
      #   authorization:
      #     credentials:
      #       name: vault-prometheus-metrics
      #       key: token
      #   tls_config:
      #     # ca_file: /etc/prometheus/certs-extra/ca.crt
      #     # cert_file: /etc/prometheus/certs-extra/tls.crt
      #     # key_file: /etc/prometheus/certs-extra/tls.key
      #     insecure_skip_verify: true                 
      #   static_configs:
      #     - targets:
      #         - 'vault.hera.ro:9283'

    # Additional volumes on the output StatefulSet definition.
    volumes:
      - name: node-exporter-mtls
        secret:
          secretName: node-exporter-mtls
    # kubectl -n monitoring create secret generic etcd-client-cert --from-file=/etc/kubernetes/pki/etcd/ca.crt --from-file=/etc/kubernetes/pki/etcd/healthcheck-client.crt --from-file=/etc/kubernetes/pki/etcd/healthcheck-client.key          
      - name: etcd-client-cert
        secret:
          secretName: etcd-client-cert
# kubectl -n monitoring create secret generic scheduler-client-cert --from-file=/opt/scheduler/ca.crt --from-file=/opt/scheduler/scheduler.crt --from-file=/opt/scheduler/scheduler.key
      # - name: scheduler-client-cert
      #   secret:
      #     secretName: scheduler-client-cert      
    # Additional VolumeMounts on the output StatefulSet definition.
    volumeMounts:
      - name: node-exporter-mtls
        mountPath: /etc/prometheus/certs-extra
        readOnly: true
      - name: etcd-client-cert
        mountPath: /etc/prometheus/etcd-client-cert
        readOnly: true
      # - name: scheduler-client-cert
      #   mountPath: /etc/prometheus/scheduler-client-cert
      #   readOnly: true    