kubeEtcd:
  enabled: true
  serviceMonitor:
   scheme: https
   insecureSkipVerify: false
   serverName: localhost
   caFile: /etc/prometheus/etcd-client-cert/ca.crt
   certFile: /etc/prometheus/etcd-client-cert/healthcheck-client.crt
   keyFile: /etc/prometheus/etcd-client-cert/healthcheck-client.key


prometheus-node-exporter:
  prometheus:
    monitor:
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
  kubeRBACProxy:
    enabled: true
    image:
      registry: repo.local
      repository: kubebuilder/kube-rbac-proxy
      tag: v0.15.0
      sha: ""
      pullPolicy: IfNotPresent
    port: 8100
    portName: http
    enableHostPort: false #
    proxyEndpointsPort: 8888
    enableProxyEndpointsHostPort: false

