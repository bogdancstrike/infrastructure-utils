  version: 2026.5.1002
  values:
  - values/sonarqube.yaml
- name: strimzi
  namespace: infrastructure
  chart: strimzi/strimzi-kafka-operator
  version: 1.3.0
  values:
  - values/strimzi.yaml
- name: cloudnative-pg
  namespace: cnpg-system
