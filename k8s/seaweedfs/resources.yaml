apiVersion: v1
kind: Namespace
metadata:
  name: infrastructure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels: &id001
    app.kubernetes.io/name: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: seaweedfs
        image: chrislusf/seaweedfs:4.48
        ports:
        - name: s3
          containerPort: 8333
        - name: master
          containerPort: 9333
        - name: filer
          containerPort: 8888
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        args:
        - server
        - -ip=seaweedfs
        - -ip.bind=0.0.0.0
        - -dir=/data
        - -master.volumeSizeLimitMB=1024
        - -volume.max=8
        - -filer
        - -s3
        - -s3.config=/etc/seaweedfs/s3.json
        readinessProbe:
          httpGet: &id002
            path: /cluster/status
            port: master
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id002
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          httpGet: *id002
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: data
          mountPath: /data
        - name: filer
          mountPath: /etc/seaweedfs/filer.toml
          subPath: filer.toml
          readOnly: true
        - name: s3-config
          mountPath: /etc/seaweedfs/s3.json
          subPath: s3.json
          readOnly: true
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: seaweedfs-data
      - name: filer
        configMap:
          name: seaweedfs-filer
      - name: s3-config
        secret:
          secretName: seaweedfs-s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels: &id001
    app.kubernetes.io/name: seaweedfs
spec:
  type: ClusterIP
  selector: *id001
  ports:
  - name: s3
    port: 8333
    targetPort: s3
  - name: master
    port: 9333
    targetPort: master
  - name: filer
    port: 8888
    targetPort: filer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
