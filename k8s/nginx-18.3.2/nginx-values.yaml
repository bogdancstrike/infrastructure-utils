global:
  imageRegistry: "nexus.hera.ro"
  imagePullSecrets: []
  security:
    allowInsecureImages: true
# storageClass: csi-cephfs-sc
nameOverride: ""
fullnameOverride: ""
## @param namespaceOverride String to fully override common.names.namespace
##
namespaceOverride: ""
## @param kubeVersion Force target Kubernetes version (using Helm capabilities if not set)
##
kubeVersion: ""
## @param clusterDomain Kubernetes Cluster Domain
##
clusterDomain: cluster.local
## @param extraDeploy Extra objects to deploy (value evaluated as a template)
##
extraDeploy: []
## @param commonLabels Add labels to all the deployed resources
##
commonLabels: {}
## @param commonAnnotations Add annotations to all the deployed resources
##
commonAnnotations: {}
## Enable diagnostic mode in the deployment(s)/statefulset(s)
##
diagnosticMode:
  ## @param diagnosticMode.enabled Enable diagnostic mode (all probes will be disabled and the command will be overridden)
  ##
  enabled: false
  ## @param diagnosticMode.command Command to override all containers in the the deployment(s)/statefulset(s)
  ##
  command:
    - sleep
  ## @param diagnosticMode.args Args to override all containers in the the deployment(s)/statefulset(s)
  ##
  args:
    - infinity
image:
  registry: nexus.hera.ro
  repository: bitnami/nginx
  tag: 1.25.4-debian-12-r7
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
  debug: false
automountServiceAccountToken: false
hostAliases: []
command: []
args: []
extraEnvVars: []
## @param extraEnvVarsCM ConfigMap with extra environment variables
##
extraEnvVarsCM: ""
## @param extraEnvVarsSecret Secret with extra environment variables
##
extraEnvVarsSecret: ""
## @section NGINX deployment parameters

## @param replicaCount Number of NGINX replicas to deploy
##
replicaCount: 1
## @param revisionHistoryLimit The number of old history to retain to allow rollback
##
revisionHistoryLimit: 10
updateStrategy:
  type: RollingUpdate
  rollingUpdate: {}
podLabels: {}
podAnnotations: {}
podAffinityPreset: ""
podAntiAffinityPreset: soft
nodeAffinityPreset:
  ## @param nodeAffinityPreset.type Node affinity preset type. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
  ##
  type: ""
  key: ""
tls:
  ## @param tls.enabled Enable TLS transport
  ##
  enabled: false
  ## @param tls.autoGenerated Auto-generate self-signed certificates
  ##
  autoGenerated: true
  ## @param tls.existingSecret Name of a secret containing the certificates
  ##
  existingSecret: ""
  ## @param tls.certFilename Path of the certificate file when mounted as a secret
  ##
  certFilename: tls.crt
  ## @param tls.certKeyFilename Path of the certificate key file when mounted as a secret
  ##
  certKeyFilename: tls.key
  ## @param tls.certCAFilename Path of the certificate CA file when mounted as a secret
  ##
  certCAFilename: ca.crt
  ## @param tls.cert Content of the certificate to be added to the secret
  ##
  cert: ""
  ## @param tls.key Content of the certificate key to be added to the secret
  ##
  key: ""
  ## @param tls.ca Content of the certificate CA to be added to the secret
  ##
  ca: ""
podSecurityContext:
  enabled: true
  fsGroupChangePolicy: Always
  supplementalGroups: []
  fsGroup: 1001
  sysctls: []
containerPorts:
  http: 8080
  https: 8443
service:
  type: LoadBalancer
  ports:
    http: 80
    https: 443
  nodePorts:
    http: ""
    https: ""
  targetPort:
    http: http
    #https: https
    https: 8443
  clusterIP: ""
  loadBalancerIP: ""
  externalTrafficPolicy: Cluster

initContainers:
  - name: init-permissions
    image: nexus.hera.ro/busybox:latest
    command: ["sh", "-c", "chown -R 1001:1001 /opt/bitnami/nginx/app/build && chmod -R 770 /opt/bitnami/nginx/app/build"]
    securityContext:
      runAsUser: 0      # Run as root to modify permissions
    volumeMounts:
      - name: nginx-buildapp-pvc
        mountPath: "/opt/bitnami/nginx/app"

extraVolumes:
  # - name: custom-index-html
  #   configMap:
  #     name: custom-index-html
  - name: custom-nginx-conf
    configMap:
      name: custom-nginx-conf
  - name: nginx-temp
    emptyDir: {}
  # - name: build
  #   hostPath:
  #     path: /root/nginx/build
  #     type: Directory
  - name: nginx-buildapp-pvc
    persistentVolumeClaim:
      claimName: nginx-buildapp-pvc
  # - name: nginx-certs
  #   secret:
  #     secretName: activator.hera.ro-tls

extraVolumeMounts:
  # - name: custom-index-html
  #   mountPath: /opt/bitnami/nginx/html/index.html
  #   subPath: index.html
  - name: custom-nginx-conf
    mountPath: /opt/bitnami/nginx/conf/nginx.conf
    subPath: nginx.conf
  - name: nginx-temp
    mountPath: /opt/bitnami/nginx/temp
  # - name: build
  #   mountPath: /opt/bitnami/nginx/html
  - name: nginx-buildapp-pvc
    mountPath: /opt/bitnami/nginx/app
  # - name: nginx-certs
  #   mountPath: /opt/bitnami/nginx/app/certs

networkPolicy:
  ## @param networkPolicy.enabled Specifies whether a NetworkPolicy should be created
  ##
  enabled: true
  allowExternal: true
  ## @param networkPolicy.allowExternalEgress Allow the pod to access any range of port and all destinations.
  ##
  allowExternalEgress: true
  extraIngress: []
  extraEgress: []
  ## @param networkPolicy.ingressNSMatchLabels [object] Labels to match to allow traffic from other namespaces
  ## @param networkPolicy.ingressNSPodMatchLabels [object] Pod labels to match to allow traffic from other namespaces
  ##
  ingressNSMatchLabels: {}
  ingressNSPodMatchLabels: {}

ingress:
  enabled: true
  hostname: activator.hera.ro
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: vault-tls-clusterissuer
    cert-manager.io/common-name: activator.hera.ro
  path: "/"
  pathType: "Prefix"
  ingressClassName: "nginx"
  tls: true


