---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: redis
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: redis-mtls-issuer
  namespace: redis
spec:
  vault:
    server: https://vault.vault:8200
    path: pki_int_mtls/sign/redis_mtls
    caBundle: 
    auth:
      kubernetes:
        role: redis_mtls_issuer
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: vault-auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redis-mtls-certs
  namespace: redis
spec:
  secretName: redis-mtls
  issuerRef:
    name: redis-mtls-issuer
    kind: Issuer
  commonName: cluster.local
  ipAddresses:
    - 127.0.0.1
  dnsNames:
    - redis
    - redis.redis
    - redis.redis.svc
    - redis.redis.svc.cluster.local
    - redis-headless
    - redis-headless.redis
    - redis-headless.redis.svc
    - redis-headless.redis.svc.cluster.local
  isCA: false
  privateKey:
    algorithm: RSA 
    encoding: PKCS8
    size: 2048
  additionalOutputFormats:
  - type: DER
  duration: 2160h0m0s
  renewBefore: 2100h0m0s
  subject:
    countries:
      - RO
    organizations:
      - Hera-mTLS
  usages:
    - digital signature
    - key encipherment
    - server auth
    - key agreement

