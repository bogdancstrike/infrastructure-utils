global:
  imageRegistry: "nexus.hera.ro"
  defaultStorageClass: ""
  storageClass: "csi-cephfs-sc"
  redis:
    password: "asd123"
image:
  registry: docker.io
  repository: bitnami/redis-cluster
  tag: 7.4.1-debian-12-r2
  pullPolicy: IfNotPresent
  debug: true
usePassword: true
password: "asd123"
existingSecret: ""
existingSecretPasswordKey: ""
usePasswordFile: false
tls:
  enabled: true
  authClients: true
  autoGenerated: false
  existingSecret: "redis-mtls"
  certFilename: "tls.crt"
  certKeyFilename: "tls.key"
  certCAFilename: "ca.crt"

# extraVolumes:
#   - name: redis-certs
#     secret:
#       secretName: redis-mtls

# extraVolumeMounts:
#   - name: redis-certs
#     mountPath: /opt/bitnami/redis/certs/
#     readOnly: true

cluster:
  init: true
  nodes: 6
  replicas: 1
# redis:
#   livenessProbe:
#     enabled: true
#     initialDelaySeconds: 200
#     periodSeconds: 200
#     timeoutSeconds: 200
#     successThreshold: 1
#     failureThreshold: 5

#   readinessProbe:
#     enabled: true
#     initialDelaySeconds: 200
#     periodSeconds: 200
#     timeoutSeconds: 200
#     successThreshold: 1
#     failureThreshold: 5

service:
  type: NodePort          # Expose the service as NodePort
  nodePorts:
    redis: 30282          # Static port to be used for Redis access
  annotations: {}
  externalTrafficPolicy: Cluster  # Ensures traffic from external nodes is properly handled

# Allow Redis to listen on all interfaces
networkPolicy:
  enabled: false  # Disable network policies to allow external access