image:
  repository: nexus.hera.ro/nextcloud
  flavor: fpm
  tag: 30.0.0-fpm
  pullPolicy: IfNotPresent
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
deploymentAnnotations: {}
deploymentLabels: {}

replicaCount: 2
ingress:
  enabled: true
  className: nginx
  annotations:
   nginx.ingress.kubernetes.io/proxy-body-size: 4G
   kubernetes.io/tls-acme: "true"
   kubernetes.io/ingress.class: nginx
   cert-manager.io/cluster-issuer: vault-tls-clusterissuer
   cert-manager.io/common-name: nextcloud.hera.ro
   nginx.ingress.kubernetes.io/enable-cors: "true"
   nginx.ingress.kubernetes.io/cors-allow-headers: "X-Forwarded-For"
   nginx.ingress.kubernetes.io/secure-backends: "true"
   nginx.ingress.kubernetes.io/proxy_set_header: "Host               $host"
   nginx.ingress.kubernetes.io/proxy_set_header: "X-Forwarded-Proto  $scheme"
   #nginx.ingress.kubernetes.io/add_header: "Referrer-Policy 'same-origin'"
   #nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"

  #  nginx.ingress.kubernetes.io/server-snippet: |-
  #    server_tokens off;
  #    proxy_hide_header X-Powered-By;
  #    rewrite ^/.well-known/webfinger /index.php/.well-known/webfinger last;
  #    rewrite ^/.well-known/nodeinfo /index.php/.well-known/nodeinfo last;
  #    rewrite ^/.well-known/host-meta /public.php?service=host-meta last;
  #    rewrite ^/.well-known/host-meta.json /public.php?service=host-meta-json;
  #    location = /.well-known/carddav {
  #      return 301 $scheme://$host/remote.php/dav;
  #    }
  #    location = /.well-known/caldav {
  #      return 301 $scheme://$host/remote.php/dav;
  #    }
  #    location = /robots.txt {
  #      allow all;
  #      log_not_found off;
  #      access_log off;
  #    }
  #    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)/ {
  #      deny all;
  #    }
  #    location ~ ^/(?:autotest|occ|issue|indie|db_|console) {
  #      deny all;
  #    }
  tls:
    - secretName: "nextcloud.hera.ro-tls"
      hosts:
        - nextcloud.hera.ro
  labels: {}
  path: /
  pathType: Prefix

lifecycle: 

phpClientHttpsFix:
  enabled: true
  protocol: https

nextcloud:
  host: nextcloud.hera.ro
  existingSecret:
    enabled: true
    secretName: nextcloud-admin-password
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password
    tokenKey: ""
    smtpUsernameKey: smtp-username
    smtpPasswordKey: smtp-password
    smtpHostKey: smtp-host
  update: 0
  containerPort: 80
  datadir: /var/www/html/data
  persistence:
    subPath:
  trustedDomains: []
  phpConfigs: {}

  defaultConfigs:
    #.htaccess: true
    #apache-pretty-urls.config.php: true
    apcu.config.php: true
    apps.config.php: true
    autoconfig.php: true
    #redis.config.php: true
    reverse-proxy.config.php: true
    #s3.config.php: true
    smtp.config.php: true
    #swift.config.php: true
    upgrade-disable-web.config.php: true

  configs:
    # proxy.config.php: |-
    #   <?php
    #   $CONFIG = array (
    #     'trusted_proxies' => array(
    #       0 => '127.0.0.1',
    #       1 => '10.0.0.0/8',
    #     ),
    #     'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
    #   );
    domains.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_domains' =>
          array (
           0 => 'localhost',
           1 => 'nextcloud.hera.ro',
          )
      );

  hooks:
    pre-installation:
    post-installation:
    pre-upgrade:
    post-upgrade:
    before-starting:

  strategy:
    type: Recreate
  extraEnv:

  extraInitContainers: []

  extraSidecarContainers: []
  extraVolumes:

  extraVolumeMounts:

  securityContext:
    runAsUser: 33
    runAsGroup: 82
    # runAsNonRoot: true
    # readOnlyRootFilesystem: false
  podSecurityContext: {}
    #fsGroup: 33

nginx:
  enabled: true
  image:
    repository: nexus.hera.ro/nginx
    tag: alpine3.20
    pullPolicy: IfNotPresent

  containerPort: 80
  ipFamilies:
    - IPv4
  config:
    default: true
  resources:
    requests:
      cpu: 200m
      memory: 500Mi
    limits:
      cpu: 2
      memory: 1Gi

  securityContext:
    # runAsUser: 33
    # runAsGroup: 82
    # runAsNonRoot: true
    # readOnlyRootFilesystem: false

  extraEnv: []

internalDatabase:
  enabled: false
  name: nextcloud

externalDatabase:
  enabled: true
  type: postgresql
  host: "pg-perso-ha.postgresdb"
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-external-db
    usernameKey: db-username
    passwordKey: db-password

service:
  type: LoadBalancer
  port: 8080
  loadBalancerIP: ""
  nodePort:
  annotations: {}

persistence:
  enabled: true
  annotations: {}
  storageClass: "csi-cephfs-sc"
  #accessMode: ReadWriteMany
  size: 64Gi
  #existingClaim: nextcloud

  nextcloudData:
    enabled: false
    subPath:
    create: true
    mount: true
    annotations: {}
    #existingClaim: nextcloud-data
    storageClass: "csi-cephfs-sc"
    #accessMode: ReadWriteOnce
    size: 64Gi

resources: {}
livenessProbe:
  enabled: false
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
readinessProbe:
  enabled: false
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
startupProbe:
  enabled: false
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1


nodeSelector: {}

tolerations: []

affinity: {}

dnsConfig: {}

## @param securityContext for nextcloud pod @deprecated Use `nextcloud.podSecurityContext` instead
securityContext: {}
