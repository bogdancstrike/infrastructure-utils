---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: vault
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-mtls-issuer
  namespace: vault
spec:
  vault:
    server: https://vault.vault:8200
    path: pki_int_mtls/sign/vault_mtls
    caBundle: 
    auth:
      kubernetes:
        role: vault_mtls_issuer
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: vault-auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-cert
  namespace: vault
spec:
  secretName: vault-tls
  issuerRef:
    name: vault-mtls-issuer
    kind: Issuer
  commonName: cluster.local
  ipAddresses:
    - 127.0.0.1
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-internal
    - vault-internal.vault
    - vault-internal.vault.svc
    - vault-internal.vault.svc.cluster.local
    - vault-0.vault-internal
    - vault-1.vault-internal
    - vault-2.vault-internal
  isCA: false
  duration: 8760h0m0s
  renewBefore: 8640h0m0s
  subject:
    countries:
      - RO
    organizations:
      - Hera-mTLS
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
    - key agreement
