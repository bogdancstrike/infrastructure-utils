global:
  enabled: true
  tlsDisable: true
injector:
  enabled: false
ui:
  enabled: true
server:
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
    ingressClassName: nginx
    hosts:
      - host: vault.hera.ro
  dev.enabled: false
  image:
    repository: "nexus.hera.ro/vault"
    tag: "1.16.1"
    pullPolicy: IfNotPresent
  auditStorage:
    enabled: true
    size: 8Gi
    storageClass: csi-rbd-sc
  standalone:
    enabled: false
  dataStorage:
    enabled: true
    size: 32Gi
    storageClass: csi-rbd-sc
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        log_level = "Debug"
        log_format = "json"
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        seal "awskms" {
          region     = "eu-west-2"
          access_key = "b9f0c83a-9d80-4cfc-b0d2-8d3608792062" # LKMS env KMS_ACCOUNT_ID
          secret_key = "b9f0c83a-9d80-4cfc-b0d2-8d3608792062" # LKMS env KMS_ACCOUNT_ID
          kms_key_id = "e14482f2-aa6f-4ace-a822-d33fd18d1ff5" # LKMS key alias/aes00
          endpoint   = "http://lkms-service.lkms:8080" # LKMS service name
        }
        cluster_addr = "[::]:8201"
        api_addr = "[::]:8200"
        storage "raft" {
          path = "/vault/data"
          performance_multiplier = 1
          autopilot {
            cleanup_dead_servers = "true"
            last_contact_threshold = "200ms"
            last_contact_failure_threshold = "10m"
            max_trailing_logs = 250000
            min_quorum = 1
            server_stabilization_time = "10s"
          }
          path = "/vault/data"
          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
        }
        telemetry {
          unauthenticated_metrics_access = true
        }
        profiling {
          unauthenticated_pprof_access = true
          unauthenticated_in_flight_request_access = true
        }
        disable_mlock = true
        service_registration "kubernetes" {}
