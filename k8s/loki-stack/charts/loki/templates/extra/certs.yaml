---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: loki
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: loki-mtls-issuer
  namespace: loki
spec:
  vault:
    server: https://vault.vault:8200
    path: pki_int_mtls/sign/loki_mtls
    caBundle: 
    auth:
      kubernetes:
        role: loki_mtls_issuer
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: vault-auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: loki-mtls-certs
  namespace: loki
spec:
  secretName: loki-mtls
  issuerRef:
    name: loki-mtls-issuer
    kind: Issuer
  commonName: cluster.local
  ipAddresses:
    - 127.0.0.1
  dnsNames:
    - loki
    - loki.svc
    - loki.svc.cluster.local
  isCA: false
  duration: 2160h0m0s
  renewBefore: 2100h0m0s
  subject:
    countries:
      - RO
    organizations:
      - Hera-mTLS
  usages:
    - digital signature
    - key encipherment
    - server auth
    - key agreement
