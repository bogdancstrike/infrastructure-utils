---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: kafka
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kafka-mtls-issuer
  namespace: kafka
spec:
  vault:
    server: https://vault.vault:8200
    path: pki_int_mtls/sign/kafka_mtls
    caBundle: 
    auth:
      kubernetes:
        role: kafka_mtls_issuer
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: vault-auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-mtls-certs
  namespace: kafka
spec:
  keystores:
    jks:
      create: true
      passwordSecretRef:
        key: keystore-pwd
        name: kafka-tls-passwords
  secretName: kafka-tls
  issuerRef:
    name: kafka-mtls-issuer
    kind: Issuer
  commonName: cluster.local
  ipAddresses:
    - 127.0.0.1
  dnsNames:
    - kafka.kafka
    - kafka-controller-0.kafka-controller-headless.kafka.svc.cluster.local
    - kafka-controller-1.kafka-controller-headless.kafka.svc.cluster.local
    - kafka-controller-2.kafka-controller-headless.kafka.svc.cluster.local
    - kafka-broker-0.kafka-broker-headless.kafka.svc.cluster.local
    - kafka-broker-1.kafka-broker-headless.kafka.svc.cluster.local
    - kafka-broker-2.kafka-broker-headless.kafka.svc.cluster.local
    - kafka-broker-headless
    - kafka-broker-headless.kafka
    - kafka-broker-headless.kafka.svc
    - kafka-controller-headless
    - kafka-controller-headless.kafka
    - kafka-controller-headless.kafka.svc
  isCA: false
  duration: 2160h0m0s
  renewBefore: 2100h0m0s
  subject:
    countries:
      - RO
    organizations:
      - Hera-mTLS
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
    - key agreement
