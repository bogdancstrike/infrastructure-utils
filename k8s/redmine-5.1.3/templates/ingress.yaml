apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "redmine.fullname" . }}
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: vault-tls-clusterissuer
    cert-manager.io/common-name: {{ include "redmine.fullname" . }}.hera.ro
    # networking.gke.io/v1beta1.FrontendConfig: {{ include "redmine.fullname" . }}
status:
  loadBalancer:
    ingress:
      - ip: 10.10.20.10
spec:
  ingressClassName: nginx
  rules:
  - host: {{ include "redmine.fullname" . }}.hera.ro
    http:
      paths:
      - backend:
          service:
            name: {{ include "redmine.fullname" . }}
            port: 
              number: 3000
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - {{ include "redmine.fullname" . }}.hera.ro
    secretName: {{ include "redmine.fullname" . }}.hera.ro-tls